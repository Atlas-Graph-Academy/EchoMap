<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Garden - Minimal Alpino</title>
  <style>
    @font-face {
      font-family: "Alpino Variable";
      src: local("Alpino Variable"), local("Alpino");
      font-style: normal;
      font-weight: 100 900;
    }

    :root {
      --display-font: "Alpino Variable", "Alpino", "Manrope", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #070f1f;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: hidden;
      font-family: var(--display-font);
    }

    .stage {
      width: min(1200px, 100%);
      aspect-ratio: 16 / 9;
      min-height: 420px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
      isolation: isolate;
    }

    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.03);
      filter: contrast(1.06) saturate(1.08);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(70% 45% at 50% 46%, rgba(255, 255, 240, 0.12), transparent 72%),
        linear-gradient(to bottom, rgba(2, 8, 16, 0.34), rgba(2, 8, 16, 0.54));
      z-index: 1;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(58% 42% at 50% 30%, rgba(196, 235, 255, 0.22), transparent 72%),
        linear-gradient(166deg, rgba(178, 224, 255, 0.12) 0%, rgba(178, 224, 255, 0) 52%),
        linear-gradient(12deg, rgba(165, 214, 255, 0.1) 0%, rgba(165, 214, 255, 0) 46%);
      mix-blend-mode: screen;
      filter: blur(1px);
      z-index: 1;
      pointer-events: none;
    }

    .title-wrap {
      position: absolute;
      left: 0;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      transform-style: preserve-3d;
      perspective: 1400px;
      pointer-events: none;
      text-align: center;
    }

    .title-wrap::before,
    .title-wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .title-wrap::before {
      width: min(94vw, 1000px);
      height: clamp(130px, 22vw, 220px);
      border-radius: 999px;
      background: radial-gradient(circle at center, rgba(214, 245, 255, 0.42), rgba(175, 226, 255, 0.15) 42%, transparent 76%);
      filter: blur(12px);
    }

    .title-wrap::after {
      width: min(96vw, 1080px);
      height: clamp(180px, 28vw, 320px);
      transform: translate(-50%, -57%);
      background:
        conic-gradient(
          from 235deg at 50% 90%,
          rgba(189, 231, 255, 0.16) 0deg,
          rgba(189, 231, 255, 0.04) 10deg,
          transparent 22deg,
          transparent 42deg,
          rgba(189, 231, 255, 0.12) 56deg,
          rgba(189, 231, 255, 0.03) 70deg,
          transparent 88deg,
          transparent 122deg,
          rgba(189, 231, 255, 0.12) 142deg,
          rgba(189, 231, 255, 0.04) 158deg,
          transparent 172deg,
          transparent 360deg
        );
      mask-image: radial-gradient(ellipse at center, black 24%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 24%, transparent 80%);
      filter: blur(2px);
      opacity: 0.92;
    }

    .title,
    .title-depth,
    .title-rim {
      position: absolute;
      left: 50%;
      top: 0;
      font-family: var(--display-font);
      font-size: clamp(46px, 9.6vw, 134px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 0.92;
      white-space: nowrap;
      transform-origin: center center;
      width: max-content;
    }

    .title-depth {
      color: rgba(76, 86, 94, 0.56);
      transform: translate3d(-50%, 1px, -14px) rotateX(4deg);
      filter: blur(0.35px);
      opacity: 0.64;
      z-index: 1;
    }

    .title-rim {
      color: transparent;
      -webkit-text-stroke: 0.95px rgba(242, 252, 255, 0.66);
      text-shadow:
        0 0 10px rgba(230, 249, 255, 0.52),
        0 0 22px rgba(196, 236, 255, 0.42),
        0 0 40px rgba(147, 214, 255, 0.26);
      transform: translate3d(-50%, 0, 10px);
      z-index: 2;
    }

    .title {
      color: #fffef7;
      -webkit-text-stroke: 0.7px rgba(16, 21, 28, 0.66);
      text-shadow:
        0 -1px 0 rgba(255, 255, 250, 0.85),
        0 1px 0 rgba(245, 241, 220, 0.92),
        0 2px 0 rgba(224, 217, 191, 0.82),
        0 0 16px rgba(238, 250, 255, 0.62),
        0 0 32px rgba(191, 231, 255, 0.38),
        0 6px 10px rgba(0, 0, 0, 0.28),
        0 14px 22px rgba(0, 0, 0, 0.17);
      transform: translate3d(-50%, 0, 21px);
      z-index: 3;
    }

    @media (max-width: 640px) {
      .stage {
        aspect-ratio: auto;
        min-height: 560px;
      }

      .title-wrap {
        left: 0;
        top: 48%;
        width: 100%;
      }

      .title,
      .title-depth,
      .title-rim {
        width: min(88vw, 560px);
        white-space: normal;
        font-size: clamp(42px, 14vw, 72px);
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Echo Garden minimal scene">
    <img src="../Resource/garden.png" alt="Echo garden background">
    <div class="title-wrap">
      <h1 class="title-depth" aria-hidden="true">Choose your echo</h1>
      <h1 class="title-rim" aria-hidden="true">Choose your echo</h1>
      <h1 class="title">Choose your echo</h1>
    </div>
  </main>
</body>
</html>
