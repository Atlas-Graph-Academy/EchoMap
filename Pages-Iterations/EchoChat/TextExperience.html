<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - Luminous Memory Interface</title>
    <style>
        /* --- 0. Aris Design System: Ganzfeld & Typography --- */
        :root {
            --bg-deep: #0f0c29;
            --bg-mid: #302b63;
            --bg-light: #24243e;
            --accent-glow: rgba(100, 200, 255, 0.6);
            --memory-gold: rgba(255, 200, 100, 0.8);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
            color: white;
            background: #000;
        }

        /* 呼吸的深空背景 */
        #ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #1a1a2e, #16213e, #000000);
            z-index: -1;
            animation: breathe 10s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(1); filter: hue-rotate(0deg); }
            100% { transform: scale(1.05); filter: hue-rotate(10deg); }
        }

        /* --- 1. The Timeline / Memory Rail (左侧或底部) --- */
        #memory-rail {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            pointer-events: none; /* Let clicks pass through */
        }

        .star-node {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-glow), 0 0 20px white;
            opacity: 0;
            animation: fadeInStar 2s forwards;
        }

        @keyframes fadeInStar {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 0.6; transform: scale(1); }
        }

        /* --- 2. The Central Echo Entity (The Stacking Stones) --- */
        #echo-stage {
            position: absolute;
            top: 30%; /* 视觉中心略偏上 */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* 核心发光体容器 */
        #cluster-core {
            position: relative;
            width: 100px;
            height: 100px;
            /* 这种堆叠感通过子元素实现 */
        }

        /* 单个“石头”或“泡泡” */
        .luminous-stone {
            position: absolute;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; /* 有机形状 */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
            filter: blur(8px);
            box-shadow: 0 0 30px var(--accent-glow);
            opacity: 0;
            transform: scale(0);
            animation: formStone 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            mix-blend-mode: screen;
        }

        .stone-highlight {
            box-shadow: 0 0 40px var(--memory-gold);
            background: radial-gradient(circle at 30% 30%, rgba(255,220,180,0.9), rgba(255,150,50,0.2));
        }

        @keyframes formStone {
            to { opacity: 0.8; transform: scale(1); }
        }

        /* 提示文字 */
        #cluster-hint {
            position: absolute;
            bottom: -60px;
            width: 300px;
            text-align: center;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.7);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
        }

        /* --- 3. Chat Interface (Glassmorphism) --- */
        #chat-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 40vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            /* 隐藏滚动条 */
            scrollbar-width: none; 
            -ms-overflow-style: none;
            mask-image: linear-gradient(to bottom, transparent, black 20%);
        }
        #chat-container::-webkit-scrollbar { display: none; }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: floatUp 0.5s ease-out;
            transition: transform 0.2s;
        }

        .msg-echo {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ddd;
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 4. Input Area --- */
        #input-area {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); box-shadow: 0 0 15px var(--accent-glow); }

        /* --- 5. Flying Particles --- */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            pointer-events: none;
            z-index: 100;
        }

    </style>
</head>
<body>

    <!-- 动态背景 -->
    <div id="ambient-bg"></div>

    <!-- 左侧：已经Drop的记忆星座 (The Galaxy) -->
    <div id="memory-rail">
        <!-- JS会在这里添加星星 -->
    </div>

    <!-- 顶部中央：Echo实体 / 正在形成的记忆堆叠 (The Cairn) -->
    <div id="echo-stage" onclick="triggerDrop()">
        <div id="cluster-core">
            <!-- 初始的一个小光点 -->
            <div class="luminous-stone" style="width: 40px; height: 40px; top: 30px; left: 30px;"></div>
        </div>
        <div id="cluster-hint">点击将这段对话凝聚为记忆</div>
    </div>

    <!-- 聊天区域 -->
    <div id="chat-container">
        <div class="message msg-echo">我是Echo。如果你感到迷茫，我们可以在这里把那些碎片拼起来。</div>
    </div>

    <!-- 输入框 -->
    <div id="input-area">
        <input type="text" id="user-input" placeholder="输入想法..." onkeypress="handleKeyPress(event)" autocomplete="off">
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const clusterCore = document.getElementById('cluster-core');
        const clusterHint = document.getElementById('cluster-hint');
        const inputField = document.getElementById('user-input');
        
        let messageCount = 0;
        let clusterIntensity = 1;

        // 模拟的随机对话
        const echoResponses = [
            "这个想法很有意思，像是某种信号。",
            "我能感觉到这句话背后的情绪，很强烈。",
            "我们正在接近某个核心，继续说。",
            "看，记忆正在聚合。",
            "你并不孤单，这种感觉很多人都有过。"
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter' && inputField.value.trim() !== "") {
                const text = inputField.value;
                inputField.value = "";
                
                // 1. 发送用户消息
                addMessage(text, 'user');

                // 2. 模拟 Echo 回复 (延迟)
                setTimeout(() => {
                    const reply = echoResponses[Math.floor(Math.random() * echoResponses.length)];
                    addMessage(reply, 'echo');
                }, 1000 + Math.random() * 1000);
            }
        }

        function addMessage(text, type) {
            // 创建消息 DOM
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(type === 'user' ? 'msg-user' : 'msg-echo');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 触发粒子动画 (从消息位置飞向 Echo)
            createParticle(msgDiv, type);
        }

        function createParticle(element, type) {
            const rect = element.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            const particle = document.createElement('div');
            particle.classList.add('particle');
            if (type === 'user') {
                 // 用户消息可能产生金色的记忆点
                if (Math.random() > 0.6) particle.style.background = "var(--memory-gold)";
            }
            document.body.appendChild(particle);

            // 设置初始位置
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';

            // 计算目标位置 (Echo Core 的中心)
            const coreRect = document.getElementById('echo-stage').getBoundingClientRect();
            const targetX = coreRect.left + coreRect.width / 2;
            const targetY = coreRect.top + coreRect.height / 2;

            // 动画
            const animation = particle.animate([
                { transform: `translate(0, 0) scale(1)`, opacity: 1 },
                { transform: `translate(${targetX - startX}px, ${targetY - startY}px) scale(0.5)`, opacity: 0 }
            ], {
                duration: 800,
                easing: 'cubic-bezier(0.4, 0.0, 0.2, 1)'
            });

            animation.onfinish = () => {
                particle.remove();
                addToCluster(type); // 粒子到达后，增加 Echo 的堆叠
            };
        }

        function addToCluster(type) {
            messageCount++;
            
            // 创建一个新的“石头/泡泡”添加到堆叠中
            const stone = document.createElement('div');
            stone.classList.add('luminous-stone');
            
            // 随机大小和位置，模拟“堆叠” (Stacking effect)
            const size = 30 + Math.random() * 40;
            // 在中心附近随机偏移，制造有机形状
            const offsetX = (Math.random() - 0.5) * 60; 
            const offsetY = (Math.random() - 0.5) * 60;

            stone.style.width = size + 'px';
            stone.style.height = size + 'px';
            stone.style.left = (35 + offsetX) + 'px'; // 居中偏移
            stone.style.top = (35 + offsetY) + 'px';

            // 如果是具有记忆价值的点（这里简单用计数模拟），高亮
            if (messageCount % 3 === 0) {
                stone.classList.add('stone-highlight');
                // 此时提示文字浮现
                clusterHint.style.opacity = 1;
                clusterHint.style.transform = 'translateY(0)';
                clusterHint.innerText = "精华已凝聚。点击将此刻化为记忆。";
            }

            clusterCore.appendChild(stone);
        }

        // 点击中央触发 "Drop" 效果
        function triggerDrop() {
            if (messageCount < 2) return; // 内容太少不触发

            const stage = document.getElementById('echo-stage');
            const rail = document.getElementById('memory-rail');
            const core = document.getElementById('cluster-core');

            // 1. 播放音效 (这里只能模拟逻辑)
            console.log("Play Sound: Hummmmm (Resonance)");

            // 2. 核心收缩并移动动画
            // 我们通过移动整个 echo-stage 来模拟飞向左侧 rail
            const railRect = rail.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            
            // 计算移动距离
            const moveX = railRect.left - stageRect.left + 20;
            const moveY = railRect.top + (rail.children.length * 40) - stageRect.top; 

            // 执行动画
            stage.style.transition = "transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 1s";
            stage.style.transform = `translate(${moveX}px, ${moveY}px) scale(0.1)`;
            stage.style.opacity = 0; // 逐渐消失，变成星星

            // 3. 动画结束后
            setTimeout(() => {
                // 重置 Stage 位置 (瞬间)
                stage.style.transition = "none";
                stage.style.transform = "translate(-50%, -50%)";
                stage.style.opacity = 1;
                
                // 清空旧的堆叠，只留一颗初始种子
                core.innerHTML = '<div class="luminous-stone" style="width: 40px; height: 40px; top: 30px; left: 30px;"></div>';
                clusterHint.style.opacity = 0;
                messageCount = 0;

                // 在 Rail 上添加一颗星星
                const star = document.createElement('div');
                star.classList.add('star-node');
                rail.appendChild(star);

                // 重新开启 transition 供下次使用
                setTimeout(() => {
                    stage.style.transition = "all 0.5s ease";
                }, 50);

            }, 1000);
        }
    </script>
</body>
</html>
