<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - Ethereal Memory</title>
    <style>
        /* --- 0. Aris Design System --- */
        :root {
            --bg-deep: #0f0c29;
            --accent-glow: rgba(100, 200, 255, 0.6);
            --memory-gold: rgba(255, 215, 120, 0.9);
            --text-glow: rgba(255, 255, 255, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "SF Pro Text", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            background: #000;
        }

        /* 呼吸的深空背景 */
        #ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, #111118, #050508, #000000);
            z-index: -1;
            animation: breathe 12s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(1); filter: hue-rotate(0deg); }
            100% { transform: scale(1.02); filter: hue-rotate(3deg); }
        }

        /* --- 1. Memory Rail (Left) --- */
        #memory-rail {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            pointer-events: none;
        }

        .star-node {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-glow), 0 0 5px white;
            opacity: 0;
            animation: fadeInStar 2s forwards;
        }

        @keyframes fadeInStar {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 0.5; transform: scale(1); }
        }

        /* --- 2. The Cloud Entity (Echo) --- */
        #echo-stage {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 云团核心 */
        #cluster-core {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .luminous-stone {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.0));
            filter: blur(18px); /* 强模糊，像雾 */
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
            opacity: 0;
            transform: scale(0);
            animation: formCloud 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            mix-blend-mode: screen;
        }

        .stone-highlight {
            box-shadow: 0 0 60px var(--memory-gold);
            background: radial-gradient(circle at 40% 40%, rgba(255,240,200,0.9), rgba(255,200,100,0.05));
        }

        @keyframes formCloud {
            to { opacity: 0.6; transform: scale(1); }
        }

        /* --- 3. The "Whisper" Text (Emerging from Light) --- */
        #whisper-text {
            position: absolute;
            /* 位于云团正中心略靠下，仿佛是云的投影 */
            top: 65%; 
            left: 50%;
            transform: translate(-50%, 20px);
            text-align: center;
            width: 100%;
            pointer-events: none;
            
            /* 初始状态：完全隐形且模糊 */
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.5s ease, filter 1.5s ease, transform 1.5s ease;
        }

        /* 激活状态 */
        #whisper-text.visible {
            opacity: 1;
            filter: blur(0px);
            transform: translate(-50%, 0); /* 慢慢上浮归位 */
            animation: floatText 4s infinite alternate ease-in-out;
        }

        .whisper-main {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 6px;
        }

        .whisper-sub {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        @keyframes floatText {
            0% { transform: translate(-50%, 0); }
            100% { transform: translate(-50%, 5px); }
        }

        /* --- 4. Chat Interface --- */
        #chat-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 420px;
            height: 35vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 10px;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom, transparent, black 15%);
        }
        #chat-container::-webkit-scrollbar { display: none; }

        .message {
            max-width: 82%;
            padding: 14px 20px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.5;
            backdrop-filter: blur(8px);
            animation: floatUp 0.6s ease-out;
        }

        .msg-echo {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            color: #ccc;
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            border-bottom-right-radius: 4px;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 5. Input --- */
        #input-area {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 420px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            padding: 16px 24px;
            color: white;
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            box-sizing: border-box;
            text-align: center; /* 更加仪式感 */
        }
        input::placeholder { color: rgba(255,255,255,0.2); }
        input:focus { 
            background: rgba(255,255,255,0.08); 
            border-color: rgba(255,255,255,0.2); 
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.05); 
        }

        /* --- 6. Particles --- */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            pointer-events: none;
            z-index: 100;
        }

    </style>
</head>
<body>

    <div id="ambient-bg"></div>

    <div id="memory-rail"></div>

    <!-- 中央舞台 -->
    <div id="echo-stage" onclick="triggerDrop()">
        <!-- 云团 -->
        <div id="cluster-core">
            <div class="luminous-stone" style="width: 50px; height: 50px; top: 25px; left: 25px; opacity: 0.3;"></div>
        </div>
        
        <!-- 浮现的文字 (The Whisper) -->
        <div id="whisper-text">
            <div class="whisper-main">A moment captured.</div>
            <div class="whisper-sub">Tap to turn it into memory</div>
        </div>
    </div>

    <div id="chat-container">
        <div class="message msg-echo">Echo is listening. The light is faint, but it's there.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="..." onkeypress="handleKeyPress(event)" autocomplete="off">
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const clusterCore = document.getElementById('cluster-core');
        const whisperText = document.getElementById('whisper-text');
        const inputField = document.getElementById('user-input');
        
        let messageCount = 0;

        const echoResponses = [
            "I see it now.",
            "It resonates.",
            "Deeper.",
            "The pattern is emerging.",
            "Yes."
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter' && inputField.value.trim() !== "") {
                const text = inputField.value;
                inputField.value = "";
                addMessage(text, 'user');
                
                setTimeout(() => {
                    const reply = echoResponses[Math.floor(Math.random() * echoResponses.length)];
                    addMessage(reply, 'echo');
                }, 800 + Math.random() * 1000);
            }
        }

        function addMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(type === 'user' ? 'msg-user' : 'msg-echo');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            createParticle(msgDiv, type);
        }

        function createParticle(element, type) {
            const rect = element.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            const particle = document.createElement('div');
            particle.classList.add('particle');
            if (type === 'user') {
                if (Math.random() > 0.5) particle.style.background = "var(--memory-gold)";
            }
            document.body.appendChild(particle);
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';

            const coreRect = clusterCore.getBoundingClientRect();
            const targetX = coreRect.left + coreRect.width / 2;
            const targetY = coreRect.top + coreRect.height / 2;

            const animation = particle.animate([
                { transform: `translate(0, 0) scale(1)`, opacity: 0.8 },
                { transform: `translate(${targetX - startX}px, ${targetY - startY}px) scale(3)`, opacity: 0 }
            ], { duration: 1200, easing: 'cubic-bezier(0.4, 0.0, 0.2, 1)' });

            animation.onfinish = () => {
                particle.remove();
                addToCluster();
            };
        }

        function addToCluster() {
            messageCount++;
            
            const stone = document.createElement('div');
            stone.classList.add('luminous-stone');
            
            // 云雾的随机性
            const size = 30 + Math.random() * 50; 
            const offsetX = (Math.random() - 0.5) * 60; 
            const offsetY = (Math.random() - 0.5) * 60;

            stone.style.width = size + 'px';
            stone.style.height = size + 'px';
            stone.style.left = (50 - size/2 + offsetX) + 'px'; 
            stone.style.top = (50 - size/2 + offsetY) + 'px';

            // 触发精华凝聚
            if (messageCount % 3 === 0) {
                stone.classList.add('stone-highlight');
                // 文字像雾一样浮现
                whisperText.classList.add('visible');
            }

            clusterCore.appendChild(stone);
        }

        function triggerDrop() {
            if (!whisperText.classList.contains('visible')) return;

            const stage = document.getElementById('echo-stage');
            const rail = document.getElementById('memory-rail');
            const core = document.getElementById('cluster-core');

            // 文字消失 (Fade out)
            whisperText.classList.remove('visible');

            // 整体缩小并飞走
            const railRect = rail.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            const moveX = railRect.left - stageRect.left + 15;
            const moveY = railRect.top + (rail.children.length * 40) - stageRect.top; 

            stage.style.transform = `translate(${moveX}px, ${moveY}px) scale(0.02)`;
            stage.style.opacity = 0;

            setTimeout(() => {
                // 重置
                stage.style.transition = "none";
                stage.style.transform = "translate(-50%, -50%)";
                stage.style.opacity = 1;
                
                core.innerHTML = '<div class="luminous-stone" style="width: 50px; height: 50px; top: 25px; left: 25px; opacity: 0.3;"></div>';
                messageCount = 0;

                // 星星生成
                const star = document.createElement('div');
                star.classList.add('star-node');
                rail.appendChild(star);

                setTimeout(() => {
                    stage.style.transition = "all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)";
                }, 50);

            }, 800);
        }
    </script>
</body>
</html>
