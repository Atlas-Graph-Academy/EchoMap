<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aris: Typographic Memory</title>
    <style>
        :root {
            --bg-void: #050505;
            --text-ink: #eeeeee;
            --text-muted: #555555;
            --accent-thoughtful: #6366f1; /* Indigo */
            --line-color: rgba(255, 255, 255, 0.15);
            --hover-fill: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-ink);
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* The Main Container */
        .memory-archive {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        /* 
           HEADER (Context)
           Mimicking your Reference 1 (Index/Browse)
        */
        .archive-header {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 40px;
            letter-spacing: -0.03em;
            color: #888;
        }
        .archive-header span {
            color: #fff;
        }

        /* 
           UNIT: THE MEMORY SLICE 
           No background. Just a bottom border.
        */
        .memory-slice {
            position: relative;
            padding: 24px 0;
            border-bottom: 1px solid var(--line-color);
            display: grid;
            grid-template-columns: 45px 1fr; /* Time Column | Content Column */
            gap: 16px;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        /* Hover Effect: Subtle highlight to show interactivity */
        .memory-slice:hover {
            background: linear-gradient(90deg, transparent, var(--hover-fill), transparent);
        }
        
        .memory-slice:hover .hook-text {
            color: #fff;
            transform: translateX(4px);
        }

        /* 
           COLUMN 1: TIME 
           Vertical, monospaced, structural.
        */
        .time-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 6px; /* Align with cap-height of text */
        }

        .time-stamp {
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* 
           COLUMN 2: THE CONTENT
        */
        .content-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 
           THE META-DATA LINE 
           Super small, technical, uppercase.
           Top aligned.
        */
        .meta-line {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .user-id { color: #888; }
        
        /* The Scenario Badge - Minimal text highlight */
        .scenario-badge {
            color: var(--accent-thoughtful);
            position: relative;
            padding-left: 8px;
        }
        .scenario-badge::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%; /* A small dot indicator */
        }

        /* 
           THE HERO: HOOK TEXT 
           Massive. Tight. Editorial.
        */
        .hook-text {
            font-size: 32px; /* Big like Ref 2 */
            font-weight: 400; /* Regular weight looks more elegant */
            line-height: 1.05;
            letter-spacing: -0.04em; /* Tight tracking is key */
            color: #d4d4d4;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            
            /* The "Object" Integration logic */
            display: inline; 
        }

        /* 
           THE "OBJECT" / THUMBNAIL
           Integrated INTO the text flow or next to it, not a separate card.
           Ref 1 has thumbnails, Ref 2 has objects.
        */
        .inline-object {
            display: inline-block;
            vertical-align: middle;
            height: 28px;
            width: 40px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            margin: 0 6px;
            position: relative;
            top: -2px;
            overflow: hidden;
        }
        
        .inline-object img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        /* 
           VISUAL RHYTHM VARIATION
           Different styles for different emphasis
        */
        
        /* Style A: Emphasis on Text */
        .hook-highlight {
            color: #fff;
        }

        /* Style B: Secondary Text (Hidden content hint) */
        .read-more-arrow {
            display: inline-block;
            font-size: 14px;
            color: var(--accent-thoughtful);
            vertical-align: top;
            margin-left: 4px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }
        
        .memory-slice:hover .read-more-arrow {
            opacity: 1;
            transform: translateX(0);
        }

    </style>
</head>
<body>

    <div class="memory-archive">
        
        <div class="archive-header">
            Index <span>(Live Memory)</span><br>
            2026 Collection
        </div>

        <!-- MEMORY 1: Text Dominant + Inline Object -->
        <div class="memory-slice">
            <div class="time-col">
                <span class="time-stamp">14:26</span>
            </div>
            <div class="content-col">
                <div class="meta-line">
                    <span class="user-id">@Kobe-Wang</span>
                    <span class="scenario-badge">Focus Mode</span>
                </div>
                <div class="hook-text hook-highlight">
                    My memory system is <span class="inline-object"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=100&auto=format&fit=crop" alt="Abstract"></span> probably the best.
                    <span class="read-more-arrow">↗</span>
                </div>
            </div>
        </div>

        <!-- MEMORY 2: Pure Typography -->
        <div class="memory-slice">
            <div class="time-col">
                <span class="time-stamp">09:15</span>
            </div>
            <div class="content-col">
                <div class="meta-line">
                    <span class="user-id">@Kobe-Wang</span>
                    <span class="scenario-badge" style="color: #d97706;">Building</span>
                </div>
                <div class="hook-text">
                    Signal acquisition stable.
                </div>
            </div>
        </div>

        <!-- MEMORY 3: Long Text Flow -->
        <div class="memory-slice">
            <div class="time-col">
                <span class="time-stamp">08:00</span>
            </div>
            <div class="content-col">
                <div class="meta-line">
                    <span class="user-id">@System</span>
                    <span class="scenario-badge" style="color: #10b981;">Daily Review</span>
                </div>
                <div class="hook-text" style="font-size: 26px;">
                    Prioritizing search. The ability to freely access all memories is the focus.
                </div>
            </div>
        </div>

    </div>

</body>
</html>
