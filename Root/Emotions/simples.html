<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Precision Emotion Orbs</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 每一个表情的容器 */
        .emotion-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 160px; /* 增加尺寸以保证清晰度 */
        }

        /* 核心球体层 (模糊发光背景) */
        .orb-glow {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: absolute;
            top: 0;
            z-index: 1;
            filter: blur(18px); /* 模仿原图的柔光效果 */
            opacity: 0.9;
            transition: transform 0.3s ease;
        }

        /* 五官层 (清晰矢量) */
        .face-svg {
            width: 120px;
            height: 120px;
            position: relative;
            z-index: 2; /* 确保五官在模糊层之上，极其清晰 */
            /* 稍微浮动一点，增加立体感 */
        }

        .label {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
            z-index: 2;
        }

        /* --- 1. Joy (高兴) --- */
        .joy-glow {
            /* 模仿原图 Joy 的金黄色渐变 */
            background: radial-gradient(circle at 30% 30%, #fff5c3, #ffd166, #ffb703);
        }
        
        /* --- 2. ADHD (不能专注) --- */
        .adhd-glow {
            /* 使用蓝紫色混合，带一点混乱的梦幻感 */
            background: radial-gradient(circle at 70% 20%, #e0aaff, #c77dff, #9d4edd);
        }

        /* --- 3. Anxiety (焦虑) --- */
        .anxiety-glow {
            /* 模仿原图 Anxiety 的焦橙色 */
            background: radial-gradient(circle at 50% 50%, #ffccbc, #ffab91, #ff7043);
        }

        /* 交互效果：鼠标悬停时稍微放大 */
        .emotion-card:hover .orb-glow {
            transform: scale(1.1);
        }
        
    </style>
</head>
<body>

    <div class="container">

        <div class="emotion-card">
            <div class="orb-glow joy-glow"></div>
            <svg class="face-svg" viewBox="0 0 100 100">
                <path d="M 25 35 Q 35 25 45 35" stroke="black" stroke-width="5" fill="none" stroke-linecap="round" />
                <path d="M 55 35 Q 65 25 75 35" stroke="black" stroke-width="5" fill="none" stroke-linecap="round" />
                <path d="M 25 55 Q 50 85 75 55" stroke="black" stroke-width="5" fill="none" stroke-linecap="round" />
                <line x1="15" y1="45" x2="20" y2="50" stroke="#eda518" stroke-width="2" opacity="0.5"/>
                <line x1="80" y1="50" x2="85" y2="45" stroke="#eda518" stroke-width="2" opacity="0.5"/>
            </svg>
            <div class="label">Joy</div>
        </div>

        <div class="emotion-card">
            <div class="orb-glow adhd-glow"></div>
            <svg class="face-svg" viewBox="0 0 100 100">
                <circle cx="35" cy="40" r="10" fill="black" />
                <circle cx="32" cy="37" r="3" fill="white" />
                
                <circle cx="70" cy="35" r="7" fill="black" />
                <circle cx="73" cy="38" r="2" fill="white" />

                <path d="M 80 20 Q 85 15 90 20 T 95 25" stroke="#black" stroke-width="2" fill="none" opacity="0.6"/>

                <path d="M 30 65 Q 40 55 50 65 T 70 65" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" />
            </svg>
            <div class="label">ADHD</div>
        </div>

        <div class="emotion-card">
            <div class="orb-glow anxiety-glow"></div>
            <svg class="face-svg" viewBox="0 0 100 100">
                <path d="M 25 30 Q 30 25 35 32" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" />
                <path d="M 65 32 Q 70 25 75 30" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" />

                <ellipse cx="30" cy="45" rx="8" ry="10" fill="black" />
                <circle cx="30" cy="45" r="2" fill="white" />

                <ellipse cx="70" cy="45" rx="8" ry="10" fill="black" />
                <circle cx="70" cy="45" r="2" fill="white" />

                <path d="M 35 70 Q 40 68 45 70 T 55 70 T 65 70" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" />
                
                <path d="M 80 40 Q 80 35 78 35 Q 76 35 76 40 Q 76 45 80 40" fill="#000" opacity="0.3" />
            </svg>
            <div class="label">Anxiety</div>
        </div>

    </div>

</body>
</html>
