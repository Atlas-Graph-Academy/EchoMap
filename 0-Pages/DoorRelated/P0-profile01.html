<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Quote Card</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-family: "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      }

      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .top-bar {
        width: min(86vw, 520px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f5f5f5;
      }

      .username {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }

      .profile-card {
        position: relative;
        width: min(86vw, 520px);
        aspect-ratio: 1 / 1;
        border-radius: 28px;
        overflow: hidden;
        background: #111;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
      }

      .profile-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) contrast(1.05);
      }

      .profile-card::before,
      .profile-card::after,
      .profile-card .side-shade {
        content: "";
        position: absolute;
        pointer-events: none;
        z-index: 2;
      }

      .profile-card::before {
        left: 0;
        right: 0;
        height: 60%;
        top: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.98) 0%,
          rgba(0, 0, 0, 0.85) 20%,
          rgba(0, 0, 0, 0.55) 45%,
          rgba(0, 0, 0, 0.25) 70%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      .profile-card::after {
        left: 0;
        right: 0;
        height: 45%;
        bottom: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0));
      }

      .side-shade {
        top: 0;
        bottom: 0;
        width: 35%;
      }

      .side-shade.left {
        left: 0;
        background: linear-gradient(to right, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      }

      .side-shade.right {
        right: 0;
        background: linear-gradient(to left, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.35);
        color: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .quote-block {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        padding: 18px 36px 28px;
        color: #f4f4f4;
        text-align: center;
      }

      .quote-text {
        font-size: 22px;
        line-height: 1.28;
        letter-spacing: 0.3px;
        font-weight: 500;
        font-style: italic;
        text-shadow:
          0 2px 8px rgba(0, 0, 0, 0.75),
          0 0 12px rgba(240, 248, 255, 0.35),
          0 0 22px rgba(200, 235, 255, 0.28),
          0 0 36px rgba(140, 220, 255, 0.22);
      }

      .quote-person {
        margin-top: 6px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.8px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-bar">
        <button class="icon-btn" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <div class="username">Adrian</div>
        <button class="icon-btn" aria-label="设置" style="justify-self: end;">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l1.2 2.4 2.7.4-1.9 1.9.4 2.7L12 9.8l-2.4 1.3.4-2.7-1.9-1.9 2.7-.4L12 3z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
      <div class="profile-card">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
          alt="背景图片"
        />
        <span class="side-shade left" aria-hidden="true"></span>
        <span class="side-shade right" aria-hidden="true"></span>
        <div class="quote-block">
          <p class="quote-text">Plant the next spark of insight in today's choices.</p>
          <div class="quote-person">— Adrian · Director</div>
        </div>
      </div>
    </div>
  </body>
</html>
