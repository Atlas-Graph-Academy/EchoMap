<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey</title>
    <style>
        :root {
            --bg-void: #000000;
            --screen-inset: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #111;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .device-frame {
            width: 430px;
            height: 932px;
            background: var(--bg-void);
            border-radius: 54px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 14px #080808, 0 0 100px rgba(0,0,0,0.8);
        }

        .status-bar {
            position: absolute;
            top: calc(var(--screen-inset) + 2px);
            left: calc(var(--screen-inset) + 2px);
            right: calc(var(--screen-inset) + 6px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            z-index: 5;
        }

        .status-right {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transform: translate(-2px, -2px);
        }

        .status-signal {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
        }

        .status-signal span {
            display: block;
            width: 2px;
            background: #FFFFFF;
            border-radius: 2px;
        }

        .status-signal span:nth-child(1) { height: 5px; opacity: 0.6; }
        .status-signal span:nth-child(2) { height: 7px; opacity: 0.75; }
        .status-signal span:nth-child(3) { height: 10px; opacity: 0.9; }
        .status-signal span:nth-child(4) { height: 12px; }

        .status-wifi {
            width: 18px;
            height: 14px;
            border: 2px solid #FFFFFF;
            border-color: #FFFFFF transparent transparent transparent;
            border-radius: 50%;
            position: relative;
            opacity: 0.9;
        }

        .status-wifi::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 5px;
            width: 5px;
            height: 5px;
            background: #FFFFFF;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        .status-battery {
            position: relative;
            width: 28px;
            height: 14px;
            border: 2px solid #FFFFFF;
            border-radius: 3px;
        }

        .status-battery::after {
            content: "";
            position: absolute;
            right: -4px;
            top: 4px;
            width: 2px;
            height: 6px;
            background: #FFFFFF;
            border-radius: 1px;
        }

        .status-battery .level {
            height: 100%;
            width: 70%;
            background: #FFFFFF;
        }

        .dynamic-island {
            position: absolute;
            top: calc(var(--screen-inset) - 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 142px;
            height: 38px;
            border-radius: 999px;
            background: #000000;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
            z-index: 6;
        }

        .bottom-image {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: auto;
            max-height: 45%;
            object-fit: contain;
            object-position: bottom center;
            display: block;
        }

        .capture-btn {
            position: absolute;
            top: -18px;
            right: 0;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(12, 12, 12, 0.7);
            color: #F3F4F6;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
        }

        .capture-btn:hover {
            background: rgba(20, 20, 20, 0.85);
            border-color: rgba(255, 255, 255, 0.32);
        }

        body.is-capturing .capture-btn {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="dynamic-island" aria-hidden="true"></div>
        <div class="status-bar" aria-hidden="true">
            <div class="status-time">9:41</div>
            <div class="status-right">
                <div class="status-signal">
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="status-wifi"></div>
                <div class="status-battery"><div class="level"></div></div>
            </div>
        </div>
        <img
            class="bottom-image"
            src="0-Pages/Landing Page-Search/images/bg-1.png"
            alt="Journey background"
        >
    </div>
    <button class="capture-btn" id="captureBtn" type="button">Save Screenshot</button>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        const captureBtn = document.getElementById("captureBtn");
        const deviceFrame = document.querySelector(".device-frame");

        captureBtn.addEventListener("click", async () => {
            if (!deviceFrame || !window.html2canvas) return;
            document.body.classList.add("is-capturing");
            await new Promise((resolve) => requestAnimationFrame(resolve));

            const canvas = await window.html2canvas(deviceFrame, {
                backgroundColor: null,
                scale: window.devicePixelRatio || 1
            });

            const link = document.createElement("a");
            link.download = "journey-screenshot.png";
            link.href = canvas.toDataURL("image/png");
            link.click();

            document.body.classList.remove("is-capturing");
        });
    </script>
</body>
</html>
